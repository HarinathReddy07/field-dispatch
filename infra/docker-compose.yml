# Local/trial stack. Run from the repo root:  docker compose -f infra/docker-compose.yml --env-file .env up -d --build
# Dev only: plain HTTP/WS. Terminate TLS (HTTPS/WSS) at a reverse proxy for any deployable setup.
name: field-dispatch

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dispatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dispatch}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot bootstrap: creates the PRIVATE evidence bucket (no anonymous access policy is set).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-dispatch-evidence}
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      mc anonymous set none local/$$S3_BUCKET"
    restart: 'no'

  # One-shot: applies SQL migrations (idempotent, advisory-locked). Runs automatically before the api starts.
  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    working_dir: /repo
    command: ['node', 'infra/scripts/migrate.js']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dispatch}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dispatch}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # One-shot, on demand:  docker compose ... run --rm seed   (idempotent synthetic demo data)
  seed:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    working_dir: /repo
    command: ['node', 'infra/seed/seed.js']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dispatch}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dispatch}
      SEED_PASSWORD: ${SEED_PASSWORD:-Passw0rd!dev}
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ['tools']
    restart: 'no'

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dispatch}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dispatch}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      PORT: '3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - '${API_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:3000
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
      # Plain HTTP local demo only. Unset it (secure cookies) behind HTTPS.
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${ADMIN_PORT:-3001}:3001'

volumes:
  pgdata:
  redisdata:
  miniodata:
