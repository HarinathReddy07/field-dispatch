# Local/trial stack. Run from the repo root:  docker compose -f infra/docker-compose.yml --env-file .env up -d --build --wait
#
# Every image is pinned to an exact version (+ digest for third-party images). Upgrade deliberately, never implicitly.
# Object storage: RustFS (S3-compatible, Apache-2.0). The previous MinIO images are no longer published
# (minio/minio is gone from Docker Hub and Quay), so a MinIO tag cannot be pinned; see docs/adr/0007-object-storage-image.md.
#
# Transport: this file is the LOCAL-DEV profile (plain HTTP/WS, INSECURE_LOCAL_DEV=true).
# The deployable HTTPS/WSS profile is infra/docker-compose.tls.yml (see docs/deploy-tls.md).
name: field-dispatch

x-api-env: &api-env
  DATABASE_URL: postgres://${POSTGRES_USER:-dispatch}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dispatch}
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://storage:9000

services:
  postgres:
    image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dispatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dispatch}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.11-alpine3.21@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for evidence. The bucket is PRIVATE: no anonymous policy exists; clients only get
  # short-lived presigned URLs from the API. Runs as the image's non-root user (uid 10001).
  storage:
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '${STORAGE_PORT:-9000}:9000'
      - '127.0.0.1:${STORAGE_CONSOLE_PORT:-9001}:9001'
    volumes:
      - storagedata:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/health']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # One-shot bootstrap: creates the private evidence bucket (idempotent).
  storage-init:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    working_dir: /repo/apps/api
    command: ['node', 'scripts/init-storage.js']
    environment:
      S3_ENDPOINT: http://storage:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-dispatch-evidence}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on:
      storage:
        condition: service_healthy
    restart: 'no'

  # One-shot: applies SQL migrations (idempotent, advisory-locked). Runs automatically before the api starts.
  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    working_dir: /repo
    command: ['node', 'infra/scripts/migrate.js']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dispatch}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dispatch}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # One-shot, on demand:  docker compose ... run --rm seed   (idempotent synthetic demo data)
  seed:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    working_dir: /repo
    command: ['node', 'infra/seed/seed.js']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dispatch}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dispatch}
      SEED_PASSWORD: ${SEED_PASSWORD:-Passw0rd!dev}
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ['tools']
    restart: 'no'

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file: ../.env
    environment:
      <<: *api-env
      PORT: '3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    ports:
      - '${API_PORT:-3000}:3000'
    stop_grace_period: 20s
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:3000
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
      # Plain HTTP local demo only. Unset it (secure cookies) behind HTTPS.
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${ADMIN_PORT:-3001}:3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/login').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  pgdata:
  redisdata:
  storagedata:
